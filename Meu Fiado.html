<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Fiado</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--pri:#0f766e;--red:#dc2626;--ok:#16a34a;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--tx:#eef0f3;--mut:#9aa3af;--pri:#2dd4bf;--red:#f87171;--ok:#4ade80;--bd:#2b323a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:20px;margin:0 0 12px}
.sum{background:var(--pri);color:#fff;border-radius:16px;padding:16px;margin-bottom:16px}
.sum small{opacity:.85}.sum b{display:block;font-size:30px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.item{display:flex;gap:12px;cursor:pointer;align-items:center}
.th{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--bd);flex:none;display:flex;align-items:center;justify-content:center;font-size:28px}
.grow{flex:1;min-width:0}.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mut{color:var(--mut);font-size:13px}.red{color:var(--red);font-weight:700}.ok{color:var(--ok);font-weight:700}
.bar{height:6px;background:var(--bd);border-radius:6px;margin:6px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--pri);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-size:16px;font-weight:600;box-shadow:0 4px 14px #0004}
button.b{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;width:100%}
button.g{background:transparent;color:var(--mut);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;font-size:14px}
button.d{background:transparent;color:var(--red);border:0;font-size:13px;padding:6px}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.big{width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-bottom:10px}
.pay{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.row{display:flex;gap:8px}.row>*{flex:1}
.back{background:none;border:0;color:var(--pri);font-size:16px;padding:0 0 10px;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.pick{display:block;border:2px dashed var(--bd);border-radius:12px;padding:14px;text-align:center;color:var(--mut);margin-bottom:10px;cursor:pointer}
.pick img{max-width:100%;max-height:180px;border-radius:8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const KEY='fiado_v1';
let db=[];try{db=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){db=[]}
let view={p:'list',id:null},tmpPhoto='';
const $=s=>document.querySelector(s);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Memória cheia. Exporte o backup e apague compras quitadas.')}};
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0;
const paid=p=>p.pays.reduce((s,x)=>s+x.v,0);
const rest=p=>Math.max(0,p.total-paid(p));
const dt=d=>new Date(d).toLocaleDateString('pt-BR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);

function resize(file,cb){const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const m=700,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};im.src=e.target.result};r.readAsDataURL(file)}

function render(){const a=$('#app');
 if(view.p==='list')return list(a);
 if(view.p==='new')return form(a);
 detail(a)}

function list(a){
 const tot=db.reduce((s,p)=>s+rest(p),0);
 let h=`<h1>🧾 Meu Fiado</h1><div class="sum"><small>Total que estou devendo</small><b>${brl(tot)}</b></div>`;
 if(!db.length)h+='<div class="empty">Nenhuma compra ainda.<br>Toque em <b>+ Nova compra</b>.</div>';
 const ord=[...db].sort((x,y)=>(rest(y)>0)-(rest(x)>0));
 ord.forEach(p=>{const r=rest(p),pc=p.total?Math.min(100,paid(p)/p.total*100):0;
  h+=`<div class="card item" onclick="go('d','${p.id}')">${p.photo?`<img class="th" src="${p.photo}">`:'<div class="th">🛍️</div>'}
  <div class="grow"><div class="nm">${esc(p.name)}</div><div class="bar"><i style="width:${pc}%"></i></div>
  <div class="mut">Total ${brl(p.total)} · pago ${brl(paid(p))}</div></div>
  <div style="text-align:right">${r>0?`<div class="red">${brl(r)}</div><div class="mut">falta</div>`:'<div class="ok">Quitado ✓</div>'}</div></div>`});
 h+=`<button class="fab" onclick="go('new')">+ Nova compra</button>
 <div class="row" style="margin-top:20px"><button class="g" onclick="exp()">⬇ Backup</button><button class="g" onclick="$('#imp').click()">⬆ Restaurar</button></div>
 <input type="file" id="imp" accept=".json" hidden onchange="imp(this)">`;
 a.innerHTML=h}

function form(a){
 a.innerHTML=`<button class="back" onclick="go('list')">← Voltar</button><h1>Nova compra</h1>
 <label class="pick" id="pk">📷 Tirar / escolher foto<input type="file" accept="image/*" id="ph" hidden onchange="pickPhoto(this)"></label>
 <label>O que comprou</label><input id="n" placeholder="Ex: Bike vermelha">
 <label>Valor total (R$)</label><input id="t" inputmode="decimal" placeholder="600">
 <label>Entrada hoje (R$) — deixe vazio se não deu nada</label><input id="e" inputmode="decimal" placeholder="100">
 <label>Data</label><input id="d" type="date" value="${today()}">
 <button class="b" onclick="addPurchase()">Salvar compra</button>`;
 tmpPhoto=''}

function pickPhoto(i){if(!i.files[0])return;resize(i.files[0],u=>{tmpPhoto=u;$('#pk').innerHTML=`<img src="${u}">`})}

function addPurchase(){
 const name=$('#n').value.trim(),total=num($('#t').value),e=num($('#e').value),d=$('#d').value||today();
 if(!name||total<=0)return alert('Informe o nome e o valor total.');
 const p={id:Date.now().toString(36),name,total,photo:tmpPhoto,date:d,pays:[]};
 if(e>0)p.pays.push({id:'e'+Date.now(),v:e,d,note:'Entrada'});
 db.push(p);save();go('d',p.id)}

function detail(a){
 const p=db.find(x=>x.id===view.id);if(!p)return go('list');
 const r=rest(p);
 let h=`<button class="back" onclick="go('list')">← Voltar</button>
 ${p.photo?`<img class="big" src="${p.photo}">`:''}
 <h1>${esc(p.name)}</h1>
 <div class="card"><div class="row"><div><div class="mut">Total</div><b>${brl(p.total)}</b></div><div><div class="mut">Pago</div><b>${brl(paid(p))}</b></div><div><div class="mut">Falta</div><span class="${r>0?'red':'ok'}">${r>0?brl(r):'Quitado ✓'}</span></div></div></div>`;
 if(r>0)h+=`<div class="card"><label>Registrar pagamento (R$)</label><input id="pv" inputmode="decimal" placeholder="Quanto você deu?">
 <label>Data</label><input id="pd" type="date" value="${today()}"><button class="b" onclick="addPay('${p.id}')">Abater da dívida</button></div>`;
 h+=`<div class="card"><b>Histórico</b>`;
 if(!p.pays.length)h+='<div class="mut" style="padding:8px 0">Nenhum pagamento ainda.</div>';
 [...p.pays].reverse().forEach(x=>{h+=`<div class="pay"><div><div class="ok">${brl(x.v)}</div><div class="mut">${dt(x.d)}${x.note?' · '+x.note:''}</div></div><button class="d" onclick="delPay('${p.id}','${x.id}')">apagar</button></div>`});
 h+=`</div><div class="mut" style="margin-bottom:10px">Comprado em ${dt(p.date)}</div><button class="d" onclick="delP('${p.id}')">🗑 Excluir esta compra</button>`;
 a.innerHTML=h}

function addPay(id){const p=db.find(x=>x.id===id),v=num($('#pv').value);
 if(v<=0)return alert('Informe o valor.');
 p.pays.push({id:'p'+Date.now(),v:Math.min(v,rest(p)),d:$('#pd').value||today(),note:''});save();render()}
function delPay(id,pid){if(!confirm('Apagar este pagamento?'))return;const p=db.find(x=>x.id===id);p.pays=p.pays.filter(x=>x.id!==pid);save();render()}
function delP(id){if(!confirm('Excluir a compra inteira?'))return;db=db.filter(x=>x.id!==id);save();go('list')}
function go(p,id){view={p,id:id||null};render();window.scrollTo(0,0)}
function exp(){const b=new Blob([JSON.stringify(db)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fiado-backup.json';a.click()}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{db=JSON.parse(e.target.result);save();render()}catch(x){alert('Arquivo inválido')}};r.readAsText(f)}
render();
</script>
</body>
</html>
